# Should we use the more efficient GitHubIssue field for duplicate detection?
jiraProjectsWithGitHubIssueField:
      - DPROD

githubProjects: []
statusTypeMappings: []
priorityTypeMappings: []

# Issue type mappings (GitHub labels → Jira issue types)
issuesTypeMappings:
  - name: Test Issue Mapping
    default: Task
    mapping:
      - fromGithubLabel: epic
        toJira: Epic
      - fromGithubLabel: bug
        toJira: Bug
      - fromGithubLabel: task
        toJira: Task
      - fromGithubLabel: story
        toJira: Story

    # ============================================================================
    # CRC Team - 8 Repos
    # ============================================================================
syncProjects:
  - name: "CRC - crc-org/crc"
    github:
      owner: crc-org
      repo: crc
      afterDate: "2026-06-01T00:00:00Z"
      syncMode: basic
      assigneeAllowlist:
        - team:CRC
    useMapping:
      issueType: Test Issue Mapping
    jira:
      projectKey: DPROD
      component: crc-org/crc
      globalIdPrefix: CRC-CRC
    maxBatchSize: 50

